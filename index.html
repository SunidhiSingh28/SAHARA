<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>SAHARA</title>
  <meta name="description" content="Sahara — Citizen-focused guidance engine.">
  
  <!-- Google Fonts: Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Theme & Components Styles -->
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/tracker.css">
</head>
<body>

  <!-- =======================================================================
       1. SAHARA BRAND / ANIMATION (STARTS CENTER -> GLIDES TO CORNER)
       ======================================================================= -->
  <div id="sahara-brand-container" aria-label="Sahara Brand" role="banner">
    <div class="sahara-emblem-wrap" id="sahara-emblem-wrap">
      
      <!-- Full Uploaded Colored Logo (Appears beside brand text in top header) -->
      <img src="assets/sahara_logo.png" alt="Sahara Logo" class="sahara-corner-full-logo" id="sahara-corner-full-logo" />

      <!-- Exact figures matching user's image (Human, Hand, Stairs - NO ring in intro) -->
      <div class="sahara-logo-scene" id="sahara-logo-scene">
        <!-- Layer 1: The Stairs / Ladder (Fades in first on white background) -->
        <img src="assets/stairs.png" alt="Stairs" class="logo-anim-elem stairs-elem" id="stairs-layer" />

        <!-- Layer 2: The Human Walking / Climbing Up Stairs -->
        <img src="assets/human.png" alt="Human Climbing Stairs" class="logo-anim-elem human-elem" id="human-layer" />

        <!-- Layer 3: Big Hand Reaching Out (Top Right) -->
        <img src="assets/hand.png" alt="Helping Hand" class="logo-anim-elem hand-elem" id="hand-layer" />
      </div>

      <!-- Brand Wordmarks: Appears after logo fades, then in corner alternates between English & Hindi -->
      <div class="sahara-brand-titles-wrap" id="sahara-brand-titles-wrap">
        <span class="sahara-brand-wordmark wordmark-en active" id="sahara-english-wordmark">SAHARA</span>
        <span class="sahara-brand-wordmark wordmark-hi" id="sahara-hindi-wordmark">सहारा</span>
      </div>
    </div>
  </div>

  <!-- =======================================================================
       2. MAIN MINIMAL INTERFACE (FADES IN AFTER INTRO)
       ======================================================================= -->
  <div id="sahara-main-ui" aria-hidden="true">

    <!-- THREE OPTIONS AT THE TOP (SIMPLE MENU-STYLE) -->
    <nav class="sahara-top-options-menu" aria-label="Main Options">
      <button class="top-menu-btn" id="opt-doc-upload">
        <span>📁</span>
        <span data-i18n="opt1Title">Document Upload</span>
      </button>

      <button class="top-menu-btn" id="opt-life-events">
        <span>💡</span>
        <span data-i18n="opt2Title">What are you trying to do?</span>
      </button>

      <button class="top-menu-btn" id="opt-services-explore">
        <span>🏛️</span>
        <span data-i18n="opt3Title">Services you might be looking for</span>
      </button>

      <button class="top-menu-btn" id="header-track-btn" style="border-color: rgba(0, 0, 0, 0.12); opacity: 0.9;">
        <span>⏳</span>
        <span data-i18n="trackApplication">Track Application</span>
      </button>
    </nav>

    <!-- CENTER STAGE: LARGE ROUNDED SEARCH BOX -->
    <main class="sahara-center-stage">

      <div class="sahara-search-wrapper">
        <div class="sahara-search-box-wrap">
          <!-- FADED ROTATING CHAKRA WHEEL (CENTERED BEHIND SEARCH BAR) -->
          <div class="sahara-chakra-backdrop" id="sahara-chakra-backdrop" aria-hidden="true">
            <img src="assets/ring.png" alt="" class="sahara-rotating-chakra" />
          </div>

          <div class="sahara-search-box">
            <input 
              type="text" 
              id="main-search-input" 
              class="sahara-search-input" 
              placeholder="What do you want?" 
              aria-label="What do you want?" 
              autocomplete="off"
            />

            <div class="sahara-search-actions">
              <!-- Speaker (Audio Readout) Button -->
              <button id="main-speaker-btn" class="sahara-speaker-button" title="Listen to recommendation / guidance" aria-label="Listen to text">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
              </button>

              <!-- Microphone Button -->
              <button id="main-mic-btn" class="sahara-mic-button" title="Speak to Sahara" aria-label="Voice input">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                  <line x1="12" y1="19" x2="12" y2="23"/>
                  <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
              </button>

              <!-- Submit Button -->
              <button id="main-search-submit" class="sahara-submit-button" title="Search" aria-label="Submit search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Realtime Voice Assistant Bar -->
        <div id="voice-assistant-bar" class="voice-bar">
          <div class="voice-indicator">
            <span id="voice-pulse-dot" class="voice-dot"></span>
            <span id="voice-transcript" class="voice-transcript">Listening to you...</span>
          </div>
          <div style="display: flex; gap: 8px;">
            <button id="replay-voice-btn" class="lang-select-btn" style="padding: 2px 8px; font-size: 11px;">
              <span>🔊</span> <span data-i18n="replayVoice">Replay</span>
            </button>
            <button id="stop-voice-btn" class="lang-select-btn" style="padding: 2px 8px; font-size: 11px;">
              <span>⏹</span> <span data-i18n="stopVoice">Stop</span>
            </button>
          </div>
        </div>
      </div>

      <!-- LANGUAGE / TRANSLATION CONTROL (DIRECTLY BELOW SEARCH) -->
      <div class="sahara-language-row">
        <button id="lang-select-btn" class="lang-select-btn" aria-haspopup="true" aria-expanded="false">
          <span>🌐</span>
          <span id="current-lang-label">English</span>
          <span style="font-size: 0.7rem; opacity: 0.6;">▾</span>
        </button>
        <div id="lang-dropdown-menu" class="lang-dropdown-menu" role="menu">
          <!-- Populated from js/i18n.js -->
        </div>
      </div>

      <!-- CHANGING RECOMMENDATION TEXT (DIRECTLY BELOW LANGUAGE) -->
      <div class="sahara-recommendation-line">
        <button id="ticker-recommendation-btn" class="recommendation-btn">
          “<span id="ticker-recommendation-text">My baby was born. What documents do I need?</span>”
        </button>
      </div>
    </main>

    <!-- Bottom Spacing Anchor -->
    <div style="height: 20px;"></div>

  </div>

  <!-- =======================================================================
       3. MODALS & SUB-VIEWS (ONLY SHOWN WHEN USER INTERACTS)
       ======================================================================= -->

  <!-- SMART QUESTION MODAL -->
  <div id="smart-question-modal" class="sahara-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="smart-q-title">
    <div class="sahara-modal-content" style="max-width: 580px;">
      <div class="modal-header">
        <span style="font-size: 11px; text-transform: uppercase; color: var(--sahara-text-muted); font-weight: 600;" data-i18n="smartQuestionLabel">Sahara Guidance Question</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="modal-speaker-btn" id="smart-q-speaker-btn" title="Read question aloud" aria-label="Listen">🔊 <span>Listen</span></button>
          <button class="modal-close-btn" aria-label="Close">✕</button>
        </div>
      </div>
      <div class="modal-body" style="text-align: center;">
        <h3 id="smart-q-title" class="smart-question-title">Do you already have a Voter ID card?</h3>
        <div id="smart-q-options" class="smart-question-options"></div>
      </div>
    </div>
  </div>

  <!-- APPLICATION KIT MODAL -->
  <div id="application-kit-modal" class="sahara-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="kit-modal-title">
    <div class="sahara-modal-content">
      <div class="modal-header">
        <h2 id="kit-modal-title" class="modal-title">Your Application Kit</h2>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="modal-speaker-btn" id="kit-modal-speaker-btn" title="Read kit aloud" aria-label="Listen">🔊 <span>Listen</span></button>
          <button class="modal-close-btn" aria-label="Close">✕</button>
        </div>
      </div>
      <div id="kit-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- DOCUMENT VAULT MODAL -->
  <div id="document-vault-modal" class="sahara-modal-backdrop" role="dialog" aria-modal="true">
    <div class="sahara-modal-content" style="max-width: 660px;">
      <div class="modal-header">
        <h2 class="modal-title" data-i18n="vaultTitle">My Documents Vault</h2>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="modal-speaker-btn" id="vault-modal-speaker-btn" title="Read vault summary" aria-label="Listen">🔊 <span>Listen</span></button>
          <button class="modal-close-btn" aria-label="Close">✕</button>
        </div>
      </div>
      <div id="vault-modal-content-area" class="modal-body"></div>
    </div>
  </div>

  <!-- LIFE EVENTS MODAL -->
  <div id="life-events-modal" class="sahara-modal-backdrop" role="dialog" aria-modal="true">
    <div class="sahara-modal-content" style="max-width: 780px;">
      <div class="modal-header">
        <h2 class="modal-title" data-i18n="opt2Title">What are you trying to do?</h2>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="modal-speaker-btn" id="life-events-modal-speaker-btn" title="Read guide aloud" aria-label="Listen">🔊 <span>Listen</span></button>
          <button class="modal-close-btn" aria-label="Close">✕</button>
        </div>
      </div>
      <div id="life-events-content-area" class="modal-body"></div>
    </div>
  </div>

  <!-- SERVICES EXPLORER MODAL -->
  <div id="services-explorer-modal" class="sahara-modal-backdrop" role="dialog" aria-modal="true">
    <div class="sahara-modal-content" style="max-width: 820px;">
      <div class="modal-header">
        <h2 class="modal-title" data-i18n="opt3Title">Services you might be looking for</h2>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="modal-speaker-btn" id="services-modal-speaker-btn" title="Read services aloud" aria-label="Listen">🔊 <span>Listen</span></button>
          <button class="modal-close-btn" aria-label="Close">✕</button>
        </div>
      </div>
      <div id="services-explorer-content-area" class="modal-body"></div>
    </div>
  </div>

  <!-- APPLICATION TRACKER MODAL -->
  <div id="application-tracker-modal" class="sahara-modal-backdrop" role="dialog" aria-modal="true">
    <div class="sahara-modal-content" style="max-width: 680px;">
      <div class="modal-header">
        <h2 class="modal-title">Application Status & Delay Tracker</h2>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="modal-speaker-btn" id="tracker-modal-speaker-btn" title="Read status aloud" aria-label="Listen">🔊 <span>Listen</span></button>
          <button class="modal-close-btn" aria-label="Close">✕</button>
        </div>
      </div>
      <div id="tracker-modal-content-area" class="modal-body"></div>
    </div>
  </div>

  <!-- AMBIGUOUS REQUEST MODAL -->
  <div id="ambiguity-modal" class="sahara-modal-backdrop" role="dialog" aria-modal="true">
    <div class="sahara-modal-content" style="max-width: 580px;">
      <div class="modal-header">
        <h2 class="modal-title">Did you mean?</h2>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="modal-speaker-btn" id="ambiguity-speaker-btn" title="Read options aloud" aria-label="Listen">🔊 <span>Listen</span></button>
          <button class="modal-close-btn" aria-label="Close">✕</button>
        </div>
      </div>
      <div id="ambiguity-content-area" class="modal-body"></div>
    </div>
  </div>

  <!-- =======================================================================
       4. PURE POINTS PRINT TARGET (ONLY PRINTS CHECKLIST POINTS)
       ======================================================================= -->
  <div id="print-checklist-target" class="printable-checklist-container" aria-hidden="true"></div>

  <!-- Main JavaScript Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
